[package]
name = "rlt-soniox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client WebSocket Soniox real-time (tokio-tungstenite + rustls): token goc/dich vao rlt-segment, phan loai loi, tu noi lai (M1)"

[dependencies]
rlt-segment = { path = "../rlt-segment" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
