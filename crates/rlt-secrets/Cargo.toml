[package]
name = "rlt-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Luu khoa API (Soniox, Gemini, OpenAI) trong Keychain macOS; trait SecretStore + ban in-memory; gia tri khoa luon bi che khi Debug"

[dependencies]
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
security-framework = "3"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager. Cung ten service voi macOS (KEYCHAIN_SERVICE).
keyring = { version = "3", default-features = false, features = ["windows-native"] }
