[package]
name = "rlt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Adapter he dieu hanh (cpal, ScreenCaptureKit, Keychain, cua so native) sau trait cua rlt-core"

[dependencies]
rlt-core.workspace = true
cpal = "0.18"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.1.2", features = ["macos_14_0"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# Chi cho spike S2 (src/bin/s2_win_capture.rs). Loi rlt-platform chua dung.
wasapi = "0.27"

[[test]]
name = "panel_real_window"
path = "tests/panel_real_window.rs"
harness = false
