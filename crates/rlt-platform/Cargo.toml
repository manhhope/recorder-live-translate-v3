[package]
name = "rlt-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Adapter he dieu hanh (cpal, ScreenCaptureKit, Keychain, cua so native) sau trait cua rlt-core"

[dependencies]
rlt-core.workspace = true
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.1.2", features = ["macos_14_0"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
