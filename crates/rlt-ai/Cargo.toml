[package]
name = "rlt-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hoi AI (US-46, US-47, US-18): trait LlmProvider (Gemini, OpenAI, Ollama qua reqwest + rustls, co stream), chat nhieu luot luu rlt-store, sanitizer noi dung mo hinh. Khoa lay qua rlt-secrets, khong tra ra frontend"

[dependencies]
rlt-secrets = { path = "../rlt-secrets" }
rlt-store = { path = "../rlt-store" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
# CO TINH NANG CODEX: BAT MAC DINH tu 3.0.6 (chu quyet 2026-11-26, docs/codex-tat-mac-dinh.md muc "Thay doi 3.0.6").
# Codex chay `codex exec --sandbox read-only` trong thu muc tam rong; muc khoa yeu hon Claude, da ghi trong chuoi giao dien
# va hop dong y. Muon tat lai: bo `codex-cli` khoi `default` duoi day (rlt-quick va src-tauri dung default cua rlt-ai).
default = ["codex-cli"]
codex-cli = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
