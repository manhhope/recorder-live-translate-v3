name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bat lenh Tauri thieu quyen capability (nguyen nhan loi nut Change).
      - run: npm run check:caps
      - run: npm run test:i18n
      - run: npm run scan:i18n
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
