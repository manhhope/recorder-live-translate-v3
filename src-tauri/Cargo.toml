[package]
name = "rlt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Recorder Live Translate v3 (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rlt-core.workspace = true
rlt-platform.workspace = true
rlt-store = { path = "../crates/rlt-store" }
rlt-ai = { path = "../crates/rlt-ai" }
rlt-secrets = { path = "../crates/rlt-secrets" }
rlt-quick = { path = "../crates/rlt-quick" }
png = "0.17"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=11.1.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
