[package]
name = "rlt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Recorder Live Translate v3 (Tauri 2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Chuyen tiep co Codex cua rlt-ai. BAT MAC DINH tu 3.0.6 (chu quyet 2026-11-26), xem rlt-ai/Cargo.toml.
default = ["codex-cli"]
codex-cli = ["rlt-ai/codex-cli"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rlt-core.workspace = true
rlt-platform.workspace = true
rlt-store = { path = "../crates/rlt-store" }
rlt-ai = { path = "../crates/rlt-ai" }
rlt-secrets = { path = "../crates/rlt-secrets" }
rlt-quick = { path = "../crates/rlt-quick" }
rlt-soniox = { path = "../crates/rlt-soniox" }
rlt-features = { path = "../crates/rlt-features" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"
sha2 = "0.10"
# default-features=false: tinh nang `rustls-tls` mac dinh keo them provider `ring` vao rustls, cung `aws_lc_rs` ma rlt-soniox/rlt-ai dung,
# rustls khong tu chon duoc provider (panic o lan TLS dau). TLS cho updater di qua reqwest `rustls` (aws-lc-rs) da co o rlt-ai.
tauri-plugin-updater = { version = "2", default-features = false, features = ["zip", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=11.1.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(windows)'.dependencies]
# Quick/Inline Translate (W2): clipboard, SendInput, UI Automation, hook chuot, tien trinh. Khop ban da co trong Cargo.lock (wasapi keo vao).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
