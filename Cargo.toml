[workspace]
resolver = "2"
members = ["crates/rlt-core", "crates/rlt-platform", "crates/rlt-store", "crates/rlt-segment", "crates/rlt-soniox", "crates/rlt-secrets", "crates/rlt-features", "crates/rlt-ai", "crates/rlt-quick", "src-tauri"]

[workspace.package]
version = "3.0.4"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
rlt-core = { path = "crates/rlt-core" }
rlt-platform = { path = "crates/rlt-platform" }
